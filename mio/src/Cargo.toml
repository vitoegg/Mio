[package]
name = "mio"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "mio"
path = "main.rs"

[dependencies]
# The protocol, the ciphers, the TCP relay and the UDP server come from shadowsocks-rust as they are.
shadowsocks = { version = "1.25", default-features = false, features = ["aead-cipher-2022"] }
shadowsocks-service = { version = "1.25", default-features = false, features = ["server", "aead-cipher-2022"] }
# Already linked by the ciphers; mio uses its SHA-1 and random numbers for the obfuscation.
aws-lc-rs = "1.16"
base64 = "0.23"
bytes = "1"
libc = "0.2"
# Debug and trace messages are compiled out of every crate.
log = { version = "0.4", features = ["max_level_info", "release_max_level_info"] }
mimalloc = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "signal"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
